# Drop-in for the unit `omnigent host enable` writes. Kept separate so
# re-running `host enable` (which rewrites the unit) preserves it.
[Unit]
After=omnigent.service
Wants=omnigent.service
# Restarting/stopping the server does the same to the host that dials it.
PartOf=omnigent.service

[Service]
# The host exits cleanly after giving up on a refused loopback server; restart
# anyway so it reconnects once the server is back.
Restart=always
